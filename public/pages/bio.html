<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>REALINDI SYSTEMS · Link in bio</title>
    <meta name="description" content="Tutti i link di REALINDI SYSTEMS in un'unica pagina." />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png" />
    <link rel="apple-touch-icon" href="/assets/app-touch.png" />
    <meta name="theme-color" content="#e9edf4" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body class="page-bio">
    <a class="skip" href="#bio-root">Vai al contenuto</a>
    <main id="bio-root" class="bio">
      <header class="bio-card">
        <img class="bio-logo" src="/assets/logo-realindi.png" alt="" width="64" height="64" />
        <p class="label">LINK IN BIO</p>
        <h1 data-slot="brand">REALINDI SYSTEMS</h1>
        <p id="bio-tagline" class="bio-tagline">REALINDI SYSTEMS — sviluppo software, consulenza e automazione.</p>
      </header>

      <nav id="bio-links" aria-label="Link di REALINDI SYSTEMS"></nav>

      <form id="bio-editor" class="bio-editor" hidden>
        <div class="bio-field">
          <label for="bio-tagline-input">Tagline</label>
          <input id="bio-tagline-input" name="tagline" type="text" maxlength="300" autocomplete="off" placeholder="Una riga su cosa fai" />
        </div>
        <div id="bio-editor-links" class="bio-editor-links"></div>
        <p class="bio-editor-hint">L'ordine delle righe è l'ordine sul sito. I link non visibili restano salvati ma non compaiono qui fuori.</p>
        <div class="bio-editor-actions">
          <button type="button" id="bio-add" class="btn btn-dark">+ Aggiungi link</button>
          <button type="submit" class="btn btn-primary">Salva</button>
          <button type="button" id="bio-cancel" class="btn btn-ghost">Annulla</button>
        </div>
        <p id="bio-editor-error" class="bio-editor-error" role="alert"></p>
      </form>

      <div class="bio-actions">
        <button type="button" id="bio-copy" class="btn btn-dark">Copia link</button>
        <!-- edit-slot:bio -->
        <span id="bio-feedback" role="status" aria-live="polite"></span>
      </div>

      <p class="bio-back"><a href="/">← Torna al sito</a></p>
    </main>
    <script src="/site.js"></script>
  </body>
</html>
